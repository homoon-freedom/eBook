<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LocalStorage eBook Manager Professional</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --p-width: 95vw; --p-height: 85vh; --bg-canvas: #1a1a1a; --page-bg: #fcfaf5; --text-color: #2c3e50; --font-size: 17px;
            --line-color: color-mix(in srgb, var(--text-color), transparent 85%);
        }
        body { background: var(--bg-canvas); display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Pretendard', sans-serif; overflow: hidden; }
        .main-wrapper { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
        
        .book-viewport { width: var(--p-width); height: var(--p-height); position: relative; overflow: hidden; border-radius: 20px; box-shadow: 0 40px 100px rgba(0,0,0,0.6); background: var(--page-bg); transition: background 0.4s ease; touch-action: none; }
        .nav-area { position: absolute; top: 0; height: 100%; width: 20%; z-index: 10; cursor: pointer; }
        .prev-area { left: 0; }
        .next-area { right: 0; }
        
        .book-container { display: flex; height: 100%; transition: transform 0.4s ease; }
        .page { min-width: var(--p-width); height: 100%; padding: 10vh 10vw 8vh 10vw; box-sizing: border-box; position: relative; color: var(--text-color); }
        .page-content { font-size: var(--font-size); line-height: 1.8; text-align: justify; word-break: break-all; white-space: pre-wrap; }

        /* 스타일 규칙 */
        .page-content i { color: #3498db; font-style: italic; opacity: 0.9; } 
        .page-content i * { color: inherit !important; font-style: inherit !important; }
        .page-content b { font-weight: bold; } 
        .txt-gray { color: #999; font-size: 0.95em; } 
        .txt-bold { font-weight: bold; }
        .txt-list-line { font-weight: bold; font-size: 1.15em; color: #000; display: block; margin: 10px 0 5px 0; }
        .txt-list-bold { font-weight: bold; display: block; margin: 5px 0; }
        
        /* ## 문장 변환 스타일 규칙 */
        .txt-heading { font-weight: bold; font-size: 1.2rem; color: #000; display: block; margin: 15px 0 10px 0; line-height: 1.4; }
        
        /* * 블릿 포인트 스타일 규칙 추가 */
        .txt-bullet { display: block; padding-left: 15px; text-indent: -15px; margin: 5px 0; color: var(--text-color); }
        
        .book-info { position: absolute; width: 80%; left: 10%; opacity: 0.7; font-size: 13px; z-index: 100; color: var(--text-color); display: flex; justify-content: space-between; align-items: center; }
        .book-header { top: 3vh; padding-bottom: 8px; border-bottom: 1.5px solid var(--line-color); }
        .book-footer { bottom: 2.5vh; padding-top: 8px; border-top: 1.5px solid var(--line-color); }
        
        #page-indicator { cursor: pointer; font-weight: bold; padding: 2px 8px; border-radius: 4px; background: rgba(0,0,0,0.05); }
        
        .bottom-menu { display: flex; gap: 5px; justify-content: center; width: 100%; flex-wrap: wrap; }
        .bottom-btn { padding: 8px 14px; border-radius: 50px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; font-size: 12px; font-weight: bold; }
        
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(700px, 90%); max-height: 85vh; background: white; padding: 25px; border-radius: 25px; z-index: 3000; display: none; color: #333; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.3); box-sizing: border-box; }
        .btn-action { width: 100%; padding: 15px; background: #3498db; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        #library-modal { width: min(500px, 85%); }
        #book-title { margin-bottom: 10px; padding: 15px; border-radius: 8px; border: 1px solid #ddd; width: 100%; box-sizing: border-box; font-size: 15px; font-weight: bold; }
        
        /* 찾기/바꾸기 컨테이너 스타일 */
        .search-replace-box { display: flex; gap: 6px; margin-bottom: 10px; width: 100%; box-sizing: border-box; }
        .search-replace-box input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; min-width: 0; }
        .btn-replace { padding: 0 15px; background: #e67e22; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; white-space: nowrap; }
        .btn-replace:hover { background: #d35400; }

        #editor { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-family: inherit; resize: none; font-size: 15px; line-height: 1.6; min-height: 350px; flex: 1; }
        #temp-measurer { width: calc(var(--p-width) - 20vw); font-size: var(--font-size); line-height: 1.8; visibility: hidden; position: absolute; white-space: pre-wrap; word-break: break-all; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="book-viewport" id="swipe-area">
            <div class="nav-area prev-area" onclick="movePage(-1)"></div>
            <div class="nav-area next-area" onclick="movePage(1)"></div>
            <div class="book-info book-header">
                <span id="display-title">불러온 도서 없음</span>
                <div style="display:flex; align-items:center; gap:8px;">
                    <button onclick="changeFontSize(-1)">-</button>
                    <span id="font-size-val">17</span>
                    <button onclick="changeFontSize(1)">+</button>
                    <button onclick="toggleBookmark()">🔖</button>
                </div>
            </div>
            <div id="viewer-container" class="book-container"></div>
            <div class="book-info book-footer">
                <div onclick="goToPage(0)" style="cursor:pointer;">« 처음</div>
                <div id="page-indicator" onclick="promptPageJump()">1 / 1</div>
                <div onclick="goToPage(totalPages - 1)" style="cursor:pointer;">끝 »</div>
            </div>
        </div>
        <div class="bottom-menu">
            <button class="bottom-btn" onclick="openLibrary()">📚 서재</button>
            <button class="bottom-btn" onclick="generateTOC()">📖 목차</button>
            <button class="bottom-btn" onclick="openBookmarks()">🔖 북마크</button>
            <button class="bottom-btn" onclick="openModal('setting-modal')">🎨 편집</button>
        </div>
    </div>

    <div id="toc-modal" class="modal"><h3>📖 목차</h3><div id="toc-list-container"></div><button class="btn-action" onclick="closeModal('toc-modal')">닫기</button></div>
    <div id="library-modal" class="modal"><h3>📚 내 서재</h3><div id="book-list-container"></div><button class="btn-action" onclick="closeModal('library-modal')">닫기</button></div>
    
    <!-- 편집 모달 -->
    <div id="setting-modal" class="modal">
        <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:15px;"><h2>🎨 편집</h2><button onclick="prepareNewBook()" style="background:#27ae60; color:white; border:none; padding:10px; border-radius:5px;">+ 새 도서</button></div>
        <input type="text" id="book-title" placeholder="제목">
        
        <!-- 찾기 / 바꾸기 입력 폼 -->
        <div class="search-replace-box">
            <input type="text" id="find-text" placeholder="찾을 텍스트">
            <input type="text" id="replace-text" placeholder="바꿀 텍스트">
            <button class="btn-replace" onclick="executeReplace()">모두 바꾸기</button>
        </div>

        <textarea id="editor" placeholder="내용..."></textarea>
        <button class="btn-action" onclick="handleSave()">💾 저장</button>
        <button class="btn-action" style="background:#95a5a6;" onclick="closeModal('setting-modal')">닫기</button>
    </div>
    <div id="bookmark-modal" class="modal"><h3>🔖 북마크</h3><div id="bookmark-list-container"></div><button class="btn-action" onclick="closeModal('bookmark-modal')">닫기</button></div>
    
    <div id="temp-measurer"></div>

    <script>
        const SUPABASE_URL = 'https://bmdlawnmwkotxvoieuce.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtZGxhd25td2tvdHh2b2lldWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMzg3NjgsImV4cCI6MjA5MzYxNDc2OH0.P3H0Gob_HFjCtz12b_KGEyC-tCWHijEyH-9SHPKAVDM';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentIndex = 0, totalPages = 1, currentFontSize = 17, currentBookId = null, currentBookmarks = [];
        let tocMap = [];

        async function init() {
            const savedSize = localStorage.getItem('eb_fontSize');
            if(savedSize) { currentFontSize = parseInt(savedSize); applyFontSizeEffect(); }
            const lastBookId = localStorage.getItem('eb_lastBookId');
            const lastPage = parseInt(localStorage.getItem('eb_lastPage') || 0);
            if(lastBookId) await loadBook(lastBookId, lastPage);
            else renderBook();
        }

        async function renderBook() {
            return new Promise((resolve) => {
                const raw = document.getElementById('editor').value || "내용을 입력하세요.";
                const maxH = document.querySelector('.book-viewport').offsetHeight * 0.8;
                const viewer = document.getElementById('viewer-container');
                const temp = document.getElementById('temp-measurer');
                
                viewer.innerHTML = "";
                temp.innerHTML = "";
                tocMap = [];
                let pCount = 0;

                const lines = raw.split('\n');
                let processedLines = [];
                
                lines.forEach(line => {
                    if (line.trim().startsWith('{l}')) {
                        tocMap.push({ title: line.replace('{l}', '').trim(), page: pCount });
                    } else if (line.trim().startsWith('**')) {
                        // ** 규칙: 일기모드 전용 (뷰어 줄 구성에서 완전히 제외하여 숨김)
                    } else {
                        processedLines.push(line);
                    }
                });

                // 순서 재조정 및 규칙 적용
                let processedHTML = processedLines.join('\n')
                    .replace(/"([^"]*)"/g, '<i>"$1"</i>')
                    .replace(/'([^']*)'/g, '<b>\'$1\'</b>')
                    .replace(/\(([^0-9][^)]*)\)/g, '<span class="txt-gray">($1)</span>')
                    .replace(/\[(.*?)\]/g, '<span class="txt-bold">$1</span>')
                    .replace(/^##\s*(.*)$/gm, '<span class="txt-heading">$1</span>') 
                    .replace(/^\*\s*(.*)$/gm, '<span class="txt-bullet">• $1</span>') // * 규칙: 블릿포인트 변환
                    .replace(/^(\d+\..*)$/gm, '<span class="txt-list-line">$1</span>')
                    .replace(/^(\d+\).*)$/gm, '<span class="txt-list-bold">$1</span>');

                const sections = processedHTML.split('{p}');

                sections.forEach((section, idx) => {
                    if (idx > 0 && temp.innerHTML.trim() !== "") {
                        addPage(temp.innerHTML);
                        pCount++;
                        temp.innerHTML = "";
                    }

                    const sectionWrapper = document.createElement('div');
                    sectionWrapper.innerHTML = section;
                    const nodes = Array.from(sectionWrapper.childNodes);

                    nodes.forEach(node => {
                        if (node.nodeType === Node.TEXT_NODE) {
                            const text = node.textContent;
                            for (let i = 0; i < text.length; i++) {
                                temp.innerHTML += text[i];
                                if (temp.offsetHeight > maxH) {
                                    const lastChar = temp.innerHTML.slice(-1);
                                    temp.innerHTML = temp.innerHTML.slice(0, -1);
                                    addPage(temp.innerHTML);
                                    pCount++;
                                    temp.innerHTML = lastChar;
                                }
                            }
                        } else {
                            const clone = node.cloneNode(true);
                            temp.appendChild(clone);
                            if (temp.offsetHeight > maxH) {
                                temp.removeChild(clone);
                                if (temp.innerHTML.trim() !== "") {
                                    addPage(temp.innerHTML);
                                    pCount++;
                                }
                                temp.innerHTML = "";
                                temp.appendChild(clone);
                            }
                        }
                    });
                });

                if (temp.innerHTML.trim() !== "") {
                    addPage(temp.innerHTML);
                    pCount++;
                }

                totalPages = pCount || 1;
                document.getElementById('page-indicator').innerText = `${currentIndex + 1} / ${totalPages}`;
                resolve();
            });
        }

        function addPage(content) {
            const div = document.createElement('div');
            div.className = 'page';
            div.innerHTML = `<div class="page-content">${content}</div>`;
            document.getElementById('viewer-container').appendChild(div);
        }

        function generateTOC() {
            let tocHTML = tocMap.map(item => `
                <div style="padding:15px; cursor:pointer; border-bottom:1px solid #eee;" 
                     onclick="goToPage(${item.page}); closeModal('toc-modal');">
                    📍 ${item.title} <span style="float:right; color:#999; font-size:12px;">p.${item.page + 1}</span>
                </div>
            `).join('');
            document.getElementById('toc-list-container').innerHTML = tocHTML || "<div style='padding:20px; color:#999;'>목차가 없습니다.</div>";
            openModal('toc-modal');
        }

        function updateSlider() {
            const w = document.querySelector('.book-viewport').offsetWidth;
            document.getElementById('viewer-container').style.transform = `translateX(${-currentIndex * w}px)`;
            document.getElementById('page-indicator').innerText = `${currentIndex + 1} / ${totalPages}`;
            localStorage.setItem('eb_lastPage', currentIndex);
        }

        function movePage(dir) {
            let n = currentIndex + dir;
            if (n >= 0 && n < totalPages) { currentIndex = n; updateSlider(); }
        }

        function goToPage(idx) { 
            currentIndex = (idx >= totalPages) ? totalPages - 1 : idx;
            updateSlider(); 
        }

        async function handleSave() {
            const title = document.getElementById('book-title').value;
            const content = document.getElementById('editor').value;
            const data = { title, content, bookmarks: currentBookmarks };
            if (currentBookId) await _supabase.from('ebooks').update(data).eq('id', currentBookId);
            else {
                const res = await _supabase.from('ebooks').insert([data]).select();
                if (res.data) currentBookId = res.data[0].id;
            }
            alert("저장되었습니다.");
            renderBook();
        }

        async function loadBook(id, page = 0) {
            const { data } = await _supabase.from('ebooks').select('*').eq('id', id).single();
            if (data) {
                currentBookId = data.id;
                localStorage.setItem('eb_lastBookId', id);
                document.getElementById('book-title').value = data.title;
                document.getElementById('editor').value = data.content;
                currentBookmarks = data.bookmarks || [];
                document.getElementById('display-title').innerText = data.title;
                await renderBook();
                currentIndex = page < totalPages ? page : 0;
                updateSlider();
            }
        }

        async function openLibrary() { 
            openModal('library-modal'); 
            const { data } = await _supabase.from('ebooks').select('id, title');
            document.getElementById('book-list-container').innerHTML = data.map(b => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:15px; border-bottom:1px solid #eee;">
                    <div style="cursor:pointer; flex:1;" onclick="loadBook('${b.id}'); closeModal('library-modal');">📘 ${b.title}</div>
                    <button onclick="deleteBook('${b.id}', '${b.title}')" style="background:#e74c3c; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer; font-size:12px;">삭제</button>
                </div>
            `).join('');
        }

        async function deleteBook(id, title) {
            if (!confirm(`'${title}'을 삭제하시겠습니까?`)) return;
            await _supabase.from('ebooks').delete().eq('id', id);
            if (currentBookId === id) location.reload();
            else openLibrary();
        }

        function openModal(id) { document.getElementById(id).style.display = 'block'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        function applyFontSizeEffect() { 
            const size = currentFontSize + 'px';
            document.documentElement.style.setProperty('--font-size', size); 
            document.getElementById('font-size-val').innerText = currentFontSize;
        }

        function changeFontSize(d) { 
            currentFontSize += d; 
            localStorage.setItem('eb_fontSize', currentFontSize);
            applyFontSizeEffect(); 
            renderBook().then(updateSlider); 
        }

        function prepareNewBook() { currentBookId = null; document.getElementById('book-title').value = ""; document.getElementById('editor').value = ""; renderBook(); }
        function toggleBookmark() { 
            if(currentBookmarks.includes(currentIndex)) currentBookmarks = currentBookmarks.filter(v => v !== currentIndex); 
            else currentBookmarks.push(currentIndex); 
            handleSave(); 
        }

        function promptPageJump() { const p = prompt("이동할 페이지:"); if(p) { currentIndex = parseInt(p)-1; updateSlider(); } }
        
        function openBookmarks() {
            document.getElementById('bookmark-list-container').innerHTML = currentBookmarks.map(p => `
                <div style="padding:15px; border-bottom:1px solid #eee; cursor:pointer;" onclick="goToPage(${p}); closeModal('bookmark-modal');">🔖 페이지 ${p+1}</div>
            `).join('') || "북마크가 없습니다.";
            openModal('bookmark-modal');
        }

        /* 찾기 및 바꾸기 실행 함수 (자동 저장 및 메인 화면 복귀 로직 탑재) */
        async function executeReplace() {
            const editor = document.getElementById('editor');
            const findInput = document.getElementById('find-text');
            const replaceInput = document.getElementById('replace-text');
            
            const findText = findInput.value;
            const replaceText = replaceInput.value;

            if (!findText) {
                alert("찾을 텍스트를 입력해주세요.");
                return;
            }

            const currentContent = editor.value;
            const matchCount = currentContent.split(findText).length - 1;

            if (matchCount === 0) {
                alert("일치하는 텍스트를 찾을 수 없습니다.");
                return;
            }

            if (confirm(`총 ${matchCount}개의 단어를 교체하고 원래 화면으로 돌아가시겠습니까?`)) {
                // 1. 텍스트 치환 및 검색창 비우기
                editor.value = currentContent.split(findText).join(replaceText);
                findInput.value = "";
                replaceInput.value = "";

                // 2. Supabase 서버 저장용 데이터 빌드
                const title = document.getElementById('book-title').value;
                const content = editor.value;
                const data = { title, content, bookmarks: currentBookmarks };
                
                if (currentBookId) {
                    await _supabase.from('ebooks').update(data).eq('id', currentBookId);
                } else {
                    const res = await _supabase.from('ebooks').insert([data]).select();
                    if (res.data) currentBookId = res.data[0].id;
                }
                
                // 3. 독서 뷰어 재구조화(랜더링) 및 동기화
                await renderBook();
                
                // 4. 모달창을 닫고 메인 메뉴로 복귀
                closeModal('setting-modal');
                
                alert(`총 ${matchCount}개의 단어가 수정되어 안전하게 저장되었습니다!`);
            }
        }

        let startX = 0;
        document.getElementById('swipe-area').addEventListener('touchstart', e => startX = e.touches[0].clientX);
        document.getElementById('swipe-area').addEventListener('touchend', e => {
            const diff = e.changedTouches[0].clientX - startX;
            if (Math.abs(diff) > 50) diff > 0 ? movePage(-1) : movePage(1);
        });

        window.onload = init;
    </script>
</body>
</html>
