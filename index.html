<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>eBook(Supabase & Image)</title>
    <!-- Supabase JS 라이브러리 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* (기존 스타일 유지) */
        :root {
            --p-width: 95vw;
            --p-height: 85vh;
            --bg-canvas: #1a1a1a;
            --page-bg: #fcfaf5;
            --text-color: #2c3e50;
            --font-size: 19px;
            --line-color: color-mix(in srgb, var(--text-color), transparent 85%);
        }

        body { 
            background: var(--bg-canvas); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; font-family: 'Pretendard', sans-serif;
            overflow: hidden; transition: background 0.4s ease;
        }

        .main-wrapper { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; }

        .book-viewport {
            width: var(--p-width); height: var(--p-height);
            position: relative; overflow: hidden; border-radius: 10px; 
            box-shadow: 0 40px 100px rgba(0,0,0,0.6); 
            background: var(--page-bg); transition: background 0.4s ease;
        }

        .book-container { display: flex; height: 100%; transition: transform 0.4s ease; }
        
        .page { 
            min-width: var(--p-width); height: 100%; 
            padding: 8.5vh 10vw 6vh 10vw; 
            box-sizing: border-box; 
            position: relative; color: var(--text-color); transition: color 0.4s ease;
        }

        .page-content { 
            font-size: var(--font-size); 
            line-height: 1.8; 
            text-align: justify; 
            word-break: break-all;
            white-space: pre-wrap;
        }

        .page-content img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 10px 0;
            border-radius: 8px;
        }

        .book-info { 
            position: absolute; width: 80%; left: 10%; 
            opacity: 0.7; font-size: 13px; z-index: 100;
            color: var(--text-color); transition: all 0.4s ease;
        }
        
        .book-header { 
            top: 3vh; padding-bottom: 8px; 
            border-bottom: 1.5px solid var(--line-color);
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .book-footer { 
            bottom: 2.5vh; padding-top: 8px; 
            border-top: 1.5px solid var(--line-color);
            text-align: center;
        }

        .font-controls { display: flex; gap: 10px; pointer-events: auto; }
        .font-btn {
            background: none; border: 1px solid var(--line-color);
            color: var(--text-color); cursor: pointer; border-radius: 4px;
            width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: bold; transition: 0.2s;
        }
        .font-btn:hover { background: var(--line-color); }

        .nav-area { position: absolute; top: 0; height: 100%; width: 15%; z-index: 50; cursor: pointer; }
        .prev-area { left: 0; } .next-area { right: 0; }

        .bottom-menu { display: flex; gap: 12px; justify-content: center; width: 100%; }
        .bottom-btn { 
            padding: 12px 24px; border-radius: 50px; background: rgba(255,255,255,0.1); 
            color: white; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; font-weight: bold;
        }

        .modal { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: min(700px, 90%); max-height: 85vh; background: white; padding: 25px; 
            border-radius: 25px; z-index: 3000; display: none; color: #333; overflow-y: auto;
        }
        
        .theme-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 15px 0; }
        .theme-item { height: 45px; border-radius: 10px; border: 2px solid #eee; cursor: pointer; transition: 0.2s; }

        textarea { width: 100%; height: 250px; padding: 12px; border-radius: 10px; border: 1px solid #ddd; font-family: inherit; margin-top: 10px; line-height: 1.5; }
        .btn-action { width: 100%; padding: 15px; background: #3498db; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 15px; }

        #temp-measurer {
            width: calc(var(--p-width) - 20vw); font-size: var(--font-size);
            line-height: 1.8; visibility: hidden; position: absolute; white-space: pre-wrap; word-break: break-all;
        }
        #temp-measurer img { max-width: 100%; height: auto; display: block; }
        
        /* 서재 아이템 스타일 */
        .book-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .book-item:hover { background: #f9f9f9; }
        .load-btn { cursor: pointer; color: #3498db; font-weight: bold; border: none; background: none; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="book-viewport">
            <div class="book-info book-header">
                <span id="display-title">Supabase 이북</span>
                <div class="font-controls">
                    <button class="font-btn" onclick="changeFontSize(-1)">-</button>
                    <button class="font-btn" onclick="changeFontSize(1)">+</button>
                </div>
            </div>

            <div class="nav-area prev-area" onclick="movePage(-1)"></div>
            <div class="nav-area next-area" onclick="movePage(1)"></div>
            
            <div id="viewer-container" class="book-container"></div>

            <div class="book-info book-footer" id="page-indicator">1 / 1</div>
        </div>

        <div class="bottom-menu">
            <button class="bottom-btn" onclick="openLibrary()">📚 내 서재</button>
            <button class="bottom-btn" onclick="openModal('setting-modal')">🎨 테마/편집</button>
        </div>
    </div>

    <!-- 설정/테마 모달 -->
    <div id="setting-modal" class="modal">
        <h3 style="margin-top:0">🎨 도서 편집 (Supabase 저장)</h3>
        <div class="theme-grid" id="theme-grid">
            <div class="theme-item" style="background:#fcfaf5;" onclick="setTheme('#fcfaf5', '#2c3e50', '#1a1a1a')"></div>
            <div class="theme-item" style="background:#ffffff;" onclick="setTheme('#ffffff', '#111111', '#f0f0f0')"></div>
            <div class="theme-item" style="background:#f4ecd8;" onclick="setTheme('#f4ecd8', '#5b4636', '#2d241e')"></div>
            <div class="theme-item" style="background:#e8f4ea;" onclick="setTheme('#e8f4ea', '#1e3a24', '#0d1a11')"></div>
            <div class="theme-item" style="background:#2d3436;" onclick="setTheme('#2d3436', '#dfe6e9', '#000000')"></div>
        </div>
        <input type="text" id="book-title" value="제목 없는 이북" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd; box-sizing:border-box;">
        <textarea id="editor" placeholder="내용을 입력하고 저장하세요."></textarea>
        <button class="btn-action" onclick="saveToSupabase()">💾 Supabase에 저장</button>
        <button class="btn-action" style="background:#95a5a6;" onclick="closeModal('setting-modal')">취소</button>
    </div>

    <!-- 서재 모달 -->
    <div id="library-modal" class="modal">
        <h3>📚 저장된 이북 목록</h3>
        <div id="book-list-container">불러오는 중...</div>
        <button class="btn-action" style="background:#95a5a6; margin-top:20px;" onclick="closeModal('library-modal')">닫기</button>
    </div>

    <div id="temp-measurer"></div>

    <script>
        // --- Supabase 초기화 ---
        const SUPABASE_URL = 'https://bmdlawnmwkotxvoieuce.supabase.co'; // 여기에 URL 입력
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtZGxhd25td2tvdHh2b2lldWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMzg3NjgsImV4cCI6MjA5MzYxNDc2OH0.P3H0Gob_HFjCtz12b_KGEyC-tCWHijEyH-9SHPKAVDM'; // 여기에 KEY 입력
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const viewerContainer = document.getElementById('viewer-container');
        const tempMeasurer = document.getElementById('temp-measurer');
        const editor = document.getElementById('editor');
        const titleInput = document.getElementById('book-title');
        const pageIndicator = document.getElementById('page-indicator');
        
        let currentIndex = 0;
        let totalPages = 1;
        let currentFontSize = 19;

        // 이미지 붙여넣기 기능
        editor.addEventListener('paste', function (e) {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let index in items) {
                const item = items[index];
                if (item.kind === 'file') {
                    const blob = item.getAsFile();
                    const reader = new FileReader();
                    reader.onload = function (event) {
                        const imgTag = `\n<img src="${event.target.result}">\n`;
                        const start = editor.selectionStart;
                        const end = editor.selectionEnd;
                        editor.value = editor.value.substring(0, start) + imgTag + editor.value.substring(end);
                    };
                    reader.readAsDataURL(blob);
                }
            }
        });

        // --- Supabase 함수 ---
        async function saveToSupabase() {
            const title = titleInput.value;
            const content = editor.value;

            const { data, error } = await _supabase
                .from('ebooks')
                .insert([{ title, content }]);

            if (error) {
                alert('저장 실패: ' + error.message);
            } else {
                alert('Supabase에 성공적으로 저장되었습니다!');
                renderBook();
                closeModal('setting-modal');
            }
        }

        async function openLibrary() {
            openModal('library-modal');
            const container = document.getElementById('book-list-container');
            container.innerHTML = '불러오는 중...';

            const { data, error } = await _supabase
                .from('ebooks')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = '목록 로드 실패';
                return;
            }

            container.innerHTML = '';
            data.forEach(book => {
                const item = document.createElement('div');
                item.className = 'book-item';
                item.innerHTML = `
                    <span>${book.title}</span>
                    <button class="load-btn" onclick="loadBook('${book.id}')">불러오기</button>
                `;
                container.appendChild(item);
            });
        }

        async function loadBook(id) {
            const { data, error } = await _supabase
                .from('ebooks')
                .select('*')
                .eq('id', id)
                .single();

            if (data) {
                titleInput.value = data.title;
                editor.value = data.content;
                renderBook();
                closeModal('library-modal');
                alert('불러오기 완료!');
            }
        }

        // --- 기존 UI 제어 함수 ---
        function openModal(id) { document.getElementById(id).style.display = 'block'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function setTheme(pBg, text, outerBg) {
            document.documentElement.style.setProperty('--page-bg', pBg);
            document.documentElement.style.setProperty('--text-color', text);
            document.documentElement.style.setProperty('--bg-canvas', outerBg);
        }

        function changeFontSize(delta) {
            currentFontSize = Math.max(12, Math.min(40, currentFontSize + delta));
            document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
            renderBook();
        }

        async function renderBook() {
            const rawContent = editor.value || "";
            const viewportH = document.querySelector('.book-viewport').offsetHeight;
            const maxH = viewportH * 0.77; 
            
            viewerContainer.innerHTML = "";
            tempMeasurer.innerHTML = "";
            
            const parts = rawContent.split(/(<img[^>]*>)/g);
            let currentPageHTML = "";
            let pageNum = 1;

            for (let part of parts) {
                if (part.startsWith('<img')) {
                    tempMeasurer.innerHTML = currentPageHTML + part;
                    if (tempMeasurer.offsetHeight > maxH && currentPageHTML !== "") {
                        addPageToViewer(currentPageHTML, pageNum++);
                        currentPageHTML = part;
                    } else {
                        currentPageHTML += part;
                    }
                } else {
                    const words = part.split(/(\s+)/);
                    for (let word of words) {
                        const testContent = currentPageHTML + word;
                        tempMeasurer.innerHTML = testContent;
                        if (tempMeasurer.offsetHeight > maxH && currentPageHTML !== "") {
                            addPageToViewer(currentPageHTML, pageNum++);
                            currentPageHTML = word;
                            tempMeasurer.innerHTML = word;
                        } else {
                            currentPageHTML = testContent;
                        }
                    }
                }
            }
            if (currentPageHTML.trim() !== "") addPageToViewer(currentPageHTML, pageNum);
            totalPages = pageNum || 1;
            currentIndex = 0;
            updateSlider();
            document.getElementById('display-title').innerText = titleInput.value;
        }

        function addPageToViewer(content, num) {
            const pageDiv = document.createElement('div');
            pageDiv.className = 'page';
            pageDiv.innerHTML = `<div class="page-content">${content}</div>`;
            viewerContainer.appendChild(pageDiv);
        }

        function movePage(dir) {
            const newIdx = currentIndex + dir;
            if (newIdx >= 0 && newIdx < totalPages) {
                currentIndex = newIdx;
                updateSlider();
            }
        }

        function updateSlider() {
            const w = document.querySelector('.book-viewport').offsetWidth;
            viewerContainer.style.transform = `translateX(${-currentIndex * w}px)`;
            pageIndicator.innerText = `${currentIndex + 1} / ${totalPages}`;
        }

        window.addEventListener('resize', renderBook);
        renderBook();
    </script>
</body>
</html>
