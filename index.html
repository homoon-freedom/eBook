<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>eBook Manager Professional</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --p-width: 95vw; --p-height: 85vh; --bg-canvas: #1a1a1a; --page-bg: #fcfaf5; --text-color: #2c3e50; --font-size: 17px;
            --line-color: color-mix(in srgb, var(--text-color), transparent 85%);
        }
        body { background: var(--bg-canvas); display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Pretendard', sans-serif; overflow: hidden; }
        .main-wrapper { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
        
        .book-viewport { width: var(--p-width); height: var(--p-height); position: relative; overflow: hidden; border-radius: 20px; box-shadow: 0 40px 100px rgba(0,0,0,0.6); background: var(--page-bg); transition: background 0.4s ease; touch-action: none; }
        .nav-area { position: absolute; top: 0; height: 100%; width: 20%; z-index: 10; cursor: pointer; }
        .prev-area { left: 0; }
        .next-area { right: 0; }
        
        .book-container { display: flex; height: 100%; transition: transform 0.4s ease; }
        .page { min-width: var(--p-width); height: 100%; padding: 10vh 10vw 8vh 10vw; box-sizing: border-box; position: relative; color: var(--text-color); }
        .page-content { font-size: var(--font-size); line-height: 1.8; text-align: justify; word-break: break-all; white-space: pre-wrap; }

        /* --- 스타일 규칙 --- */
        .page-content i { color: #3498db; font-style: italic; opacity: 0.9; } /* 큰따옴표 파란색 */
        .page-content b { font-weight: bold; color: inherit; } /* 작은따옴표 굵게 (색상은 부모상속) */
        .txt-gray { color: #999; font-size: 0.95em; } /* 일반 괄호 회색 */
        .txt-bold { font-weight: bold; }
        .txt-list-line { font-weight: bold; font-size: 1.15em; color: #000; display: block; margin: 10px 0 5px 0; }
        .txt-list-bold { font-weight: bold; display: block; margin: 5px 0; }
        
        .book-info { position: absolute; width: 80%; left: 10%; opacity: 0.7; font-size: 13px; z-index: 100; color: var(--text-color); display: flex; justify-content: space-between; align-items: center; }
        .book-header { top: 3vh; padding-bottom: 8px; border-bottom: 1.5px solid var(--line-color); }
        .book-footer { bottom: 2.5vh; padding-top: 8px; border-top: 1.5px solid var(--line-color); }
        
        #page-indicator { cursor: pointer; font-weight: bold; padding: 2px 8px; border-radius: 4px; background: rgba(0,0,0,0.05); }
        .sup-highlight { font-size: 0.75em; vertical-align: super; line-height: 0; margin-left: 2px; color: #3498db; cursor: pointer; font-weight: bold; text-decoration: underline; }
        
        .bottom-menu { display: flex; gap: 5px; justify-content: center; width: 100%; flex-wrap: wrap; }
        .bottom-btn { padding: 8px 14px; border-radius: 50px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; font-size: 12px; font-weight: bold; }
        
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(700px, 90%); max-height: 85vh; background: white; padding: 25px; border-radius: 25px; z-index: 3000; display: none; color: #333; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.3); box-sizing: border-box; }
        .btn-action { width: 100%; padding: 15px; background: #3498db; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        #library-modal { width: min(500px, 85%); }
        #bookmark-modal { width: min(400px, 80%); }
        
        textarea { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #ddd; font-family: inherit; resize: none; font-size: 15px}
        #anno-viewer-popup { position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%); width: 80%; max-width: 400px; background: rgba(0,0,0,0.85); color: white; padding: 15px; border-radius: 15px; z-index: 2000; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
        
        #temp-measurer { width: calc(var(--p-width) - 20vw); font-size: var(--font-size); line-height: 1.8; visibility: hidden; position: absolute; white-space: pre-wrap; word-break: break-all; }
        #setting-modal { width: 95vw; height: 90vh; flex-direction: column; }
        #setting-modal textarea { flex: 1; min-height: 400px; margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="book-viewport" id="swipe-area">
            <div class="nav-area prev-area" onclick="movePage(-1)"></div>
            <div class="nav-area next-area" onclick="movePage(1)"></div>
            <div class="book-info book-header">
                <span id="display-title">불러온 도서 없음</span>
                <div style="display:flex; align-items:center; gap:8px;">
                    <button class="btn-small" onclick="changeFontSize(-1)">가-</button>
                    <span id="font-size-val">17</span>
                    <button class="btn-small" onclick="changeFontSize(1)">가+</button>
                    <button class="btn-small btn-blue" onclick="toggleBookmark()">🔖</button>
                </div>
            </div>
            <div id="viewer-container" class="book-container"></div>
            <div class="book-info book-footer">
                <div onclick="goToPage(0)" style="cursor:pointer;">« 처음</div>
                <div id="page-indicator" onclick="promptPageJump()">1 / 1</div>
                <div onclick="goToPage(totalPages - 1)" style="cursor:pointer;">끝 »</div>
            </div>
        </div>
        <div class="bottom-menu">
            <button class="bottom-btn" onclick="openLibrary()">📚 서재</button>
            <button class="bottom-btn" onclick="generateTOC()">📖 목차</button>
            <button class="bottom-btn" onclick="openAllAnnotations()">📑 주석</button>
            <button class="bottom-btn" onclick="openBookmarks()">🔖 북마크</button>
            <button class="bottom-btn" onclick="openModal('setting-modal')">🎨 편집</button>
        </div>
    </div>

    <!-- 모달창들 (TOC, Library, Settings, Bookmark, Anno) -->
    <div id="toc-modal" class="modal"><h3>📖 목차</h3><div id="toc-list-container"></div><button class="btn-action" onclick="closeModal('toc-modal')">닫기</button></div>
    <div id="library-modal" class="modal"><h3>📚 내 서재</h3><div id="book-list-container"></div><button class="btn-action" onclick="closeModal('library-modal')">닫기</button></div>
    <div id="setting-modal" class="modal">
        <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:15px;"><h2>🎨 편집</h2><button onclick="prepareNewBook()" style="background:#27ae60; color:white; border:none; padding:10px; border-radius:5px;">+ 새 도서</button></div>
        <input type="text" id="book-title" placeholder="제목" style="margin-bottom:10px; padding:10px; border-radius:5px; border:1px solid #ddd;">
        <textarea id="editor" placeholder="내용..."></textarea>
        <button class="btn-action" onclick="handleSave()">💾 저장</button>
        <button class="btn-action" style="background:#95a5a6;" onclick="closeModal('setting-modal')">닫기</button>
    </div>
    <div id="bookmark-modal" class="modal"><h3>🔖 북마크</h3><div id="bookmark-list-container"></div><button class="btn-action" onclick="closeModal('bookmark-modal')">닫기</button></div>
    <div id="all-annotations-modal" class="modal"><h3>📑 주석 관리</h3><div id="all-anno-list-container"></div><button class="btn-action" onclick="closeModal('all-annotations-modal')">닫기</button></div>
    
    <div id="anno-viewer-popup">
        <div id="anno-viewer-text"></div>
        <div style="text-align:right; margin-top:10px;"><span id="go-to-edit-btn" style="color:#3498db; cursor:pointer;">수정</span> <span onclick="document.getElementById('anno-viewer-popup').style.display='none'" style="margin-left:15px; cursor:pointer;">닫기</span></div>
    </div>
    <div id="temp-measurer"></div>

    <script>
        const SUPABASE_URL = 'https://bmdlawnmwkotxvoieuce.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtZGxhd25td2tvdHh2b2lldWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMzg3NjgsImV4cCI6MjA5MzYxNDc2OH0.P3H0Gob_HFjCtz12b_KGEyC-tCWHijEyH-9SHPKAVDM';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentIndex = 0, totalPages = 1, currentFontSize = 17, currentBookId = null, currentAnnotations = {}, currentBookmarks = [];

        async function init() {
            const savedSize = localStorage.getItem('eb_fontSize');
            if(savedSize) { currentFontSize = parseInt(savedSize); applyFontSizeEffect(); }
            const lastBookId = localStorage.getItem('eb_lastBookId');
            if(lastBookId) await loadBook(lastBookId, parseInt(localStorage.getItem('eb_lastPage') || 0));
            else renderBook();
        }

        async function renderBook() {
            return new Promise((resolve) => {
                const raw = document.getElementById('editor').value || "도서를 로드하거나 작성하세요.";
                const maxH = document.querySelector('.book-viewport').offsetHeight * 0.8;
                const viewer = document.getElementById('viewer-container');
                const temp = document.getElementById('temp-measurer');
                viewer.innerHTML = "";
                
                const sections = raw.split('{p}');
                let pCount = 0;

                sections.forEach((section, sIdx) => {
                    if (section.trim() === "" && sIdx !== 0) return;

                    let html = section
                        .replace(/^### (.*$)/gm, '<strong style="display:block; font-size:1.4em; margin:20px 0; color:#2c3e50; border-left:4px solid #3498db; padding-left:10px;">$1</strong>')
                        .replace(/"([^"]*)"/g, '<i>"$1"</i>')
                        .replace(/'([^']*)'/g, '<b>\'$1\'</b>')
                        .replace(/\[(.*?)\]/g, '<span class="txt-bold">$1</span>')
                        .replace(/\(([^0-9][^)]*)\)/g, '<span class="txt-gray">($1)</span>')
                        .replace(/^(\d+\..*)$/gm, '<span class="txt-list-line">$1</span>')
                        .replace(/^(\d+\).*)$/gm, '<span class="txt-list-bold">$1</span>')
                        .replace(/\((\d+)\)(\S*)/g, '<span class="anno-clickable-group" onclick="openAnnotation($1, event)"><span class="sup-highlight">$1</span><span class="anno-text-link">$2</span></span>');

                    const wrapper = document.createElement('div');
                    wrapper.innerHTML = html;
                    const nodes = Array.from(wrapper.childNodes);
                    
                    let currentHTML = "";
                    temp.innerHTML = "";

                    nodes.forEach(node => {
                        const clone = node.cloneNode(true);
                        temp.appendChild(clone);
                        if (temp.offsetHeight > maxH && currentHTML !== "") {
                            addPage(currentHTML);
                            pCount++;
                            temp.innerHTML = "";
                            temp.appendChild(clone);
                        }
                        currentHTML = temp.innerHTML;
                    });
                    if (currentHTML.trim() !== "") { addPage(currentHTML); pCount++; }
                });
                totalPages = pCount || 1;
                document.getElementById('page-indicator').innerText = `${currentIndex + 1} / ${totalPages}`;
                resolve();
            });
        }

        function addPage(content) {
            const div = document.createElement('div');
            div.className = 'page';
            div.innerHTML = `<div class="page-content">${content}</div>`;
            document.getElementById('viewer-container').appendChild(div);
        }

        function movePage(dir) {
            let n = currentIndex + dir;
            if (n >= 0 && n < totalPages) { currentIndex = n; updateSlider(); }
        }

        function updateSlider() {
            const w = document.querySelector('.book-viewport').offsetWidth;
            document.getElementById('viewer-container').style.transform = `translateX(${-currentIndex * w}px)`;
            document.getElementById('page-indicator').innerText = `${currentIndex + 1} / ${totalPages}`;
            localStorage.setItem('eb_lastPage', currentIndex);
        }

        async function loadBook(id, page = 0) {
            const { data } = await _supabase.from('ebooks').select('*').eq('id', id).single();
            if (data) {
                currentBookId = data.id;
                document.getElementById('book-title').value = data.title;
                document.getElementById('editor').value = data.content;
                currentAnnotations = data.annotations || {};
                currentBookmarks = data.bookmarks || [];
                document.getElementById('display-title').innerText = data.title;
                await renderBook();
                currentIndex = page < totalPages ? page : 0;
                updateSlider();
            }
        }

        async function handleSave() {
            const title = document.getElementById('book-title').value;
            const content = document.getElementById('editor').value;
            const data = { title, content, annotations: currentAnnotations, bookmarks: currentBookmarks };
            if (currentBookId) await _supabase.from('ebooks').update(data).eq('id', currentBookId);
            else {
                const res = await _supabase.from('ebooks').insert([data]).select();
                if (res.data) currentBookId = res.data[0].id;
            }
            alert("저장되었습니다.");
            renderBook();
        }

        function openModal(id) { document.getElementById(id).style.display = 'block'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function applyFontSizeEffect() { document.documentElement.style.setProperty('--font-size', currentFontSize + 'px'); document.getElementById('font-size-val').innerText = currentFontSize; }
        function changeFontSize(d) { currentFontSize += d; applyFontSizeEffect(); renderBook().then(updateSlider); }
        function prepareNewBook() { currentBookId = null; document.getElementById('book-title').value = ""; document.getElementById('editor').value = ""; renderBook(); }
        function toggleBookmark() { if(currentBookmarks.includes(currentIndex)) currentBookmarks = currentBookmarks.filter(v => v !== currentIndex); else currentBookmarks.push(currentIndex); handleSave(); }
        function promptPageJump() { const p = prompt("이동할 페이지:"); if(p) { currentIndex = parseInt(p)-1; updateSlider(); } }
        function openLibrary() { openModal('library-modal'); _supabase.from('ebooks').select('id, title').then(res => {
            document.getElementById('book-list-container').innerHTML = res.data.map(b => `<div style="padding:10px; border-bottom:1px solid #eee; cursor:pointer;" onclick="loadBook('${b.id}')">${b.title}</div>`).join('');
        });}
        function generateTOC() {
            const items = document.getElementById('editor').value.split('\n').filter(l => l.startsWith('###')).map(l => l.replace('###','').trim());
            document.getElementById('toc-list-container').innerHTML = items.map(i => `<div style="padding:10px; cursor:pointer;" onclick="closeModal('toc-modal')">${i}</div>`).join('');
            openModal('toc-modal');
        }
        function openAnnotation(n, e) {
            e.stopPropagation();
            document.getElementById('anno-viewer-text').innerText = currentAnnotations[n] || "내용 없음";
            document.getElementById('anno-viewer-popup').style.display = 'block';
        }

        let startX = 0;
        document.getElementById('swipe-area').addEventListener('touchstart', e => startX = e.touches[0].clientX);
        document.getElementById('swipe-area').addEventListener('touchend', e => {
            const diff = e.changedTouches[0].clientX - startX;
            if (Math.abs(diff) > 50) diff > 0 ? movePage(-1) : movePage(1);
        });

        window.onload = init;
    </script>
</body>
</html>
