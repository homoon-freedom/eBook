<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>eBook (Integrated Editor)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --p-width: 95vw;
            --p-height: 85vh;
            --bg-canvas: #1a1a1a;
            --page-bg: #fcfaf5;
            --text-color: #2c3e50;
            --font-size: 17px;
            --line-color: color-mix(in srgb, var(--text-color), transparent 85%);
        }

        body { 
            background: var(--bg-canvas); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; font-family: 'Pretendard', sans-serif;
            overflow: hidden; transition: background 0.4s ease;
        }

        .main-wrapper { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; }

        .book-viewport {
            width: var(--p-width); height: var(--p-height);
            position: relative; overflow: hidden; border-radius: 20px; 
            box-shadow: 0 40px 100px rgba(0,0,0,0.6); 
            background: var(--page-bg); transition: background 0.4s ease;
            touch-action: none; /* 브라우저 기본 스와이프 방지 */
        }

        .book-container { display: flex; height: 100%; transition: transform 0.4s ease; }
        
        .page { 
            min-width: var(--p-width); height: 100%; 
            padding: 10vh 10vw 15vh 10vw; 
            box-sizing: border-box; 
            position: relative; color: var(--text-color); transition: color 0.4s ease;
            user-select: none;
        }

        .page-content { 
            font-size: var(--font-size); line-height: 1.8; text-align: justify; 
            word-break: break-all; white-space: pre-wrap;
        }

        .page-content img { max-width: 100%; height: auto; display: block; margin: 10px 0; border-radius: 8px; }

        .book-info { 
            position: absolute; width: 80%; left: 10%; 
            opacity: 0.7; font-size: 13px; z-index: 100;
            color: var(--text-color); transition: all 0.4s ease;
        }
        
        .book-header { 
            top: 3vh; padding-bottom: 8px; border-bottom: 1.5px solid var(--line-color);
            display: flex; justify-content: space-between; align-items: center;
        }
        
        .book-footer { 
            bottom: 2.5vh; padding-top: 8px; border-top: 1.5px solid var(--line-color); 
            display: flex; justify-content: space-between; align-items: center;
        }

        .page-nav-btns { display: flex; gap: 15px; font-weight: bold; cursor: pointer; user-select: none; }
        .page-nav-btns span:hover { color: #3498db; }

        #page-indicator { cursor: pointer; padding: 2px 8px; border-radius: 4px; transition: 0.2s; }
        #page-indicator:hover { background: var(--line-color); }

        .font-controls { display: flex; gap: 8px; align-items: center; }
        #font-size-val { min-width: 20px; text-align: center; font-weight: bold; font-size: 12px; color: var(--text-color); }

        .font-btn {
            background: none; border: 1px solid var(--line-color);
            color: var(--text-color); cursor: pointer; border-radius: 4px;
            width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: bold; transition: 0.2s;
        }
        .font-btn:hover { background: var(--line-color); }

        .nav-area { position: absolute; top: 0; height: 100%; width: 15%; z-index: 50; cursor: pointer; }
        .prev-area { left: 0; } .next-area { right: 0; }

        .bottom-menu { display: flex; gap: 10px; justify-content: center; width: 100%; flex-wrap: wrap; }
        .bottom-btn { 
            padding: 10px 18px; border-radius: 50px; background: rgba(255,255,255,0.1); 
            color: white; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; font-weight: bold;
            font-size: 13px;
        }
        .bottom-btn:hover { background: rgba(255,255,255,0.2); }

        .modal { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: min(700px, 90%); max-height: 85vh; background: white; padding: 25px; 
            border-radius: 25px; z-index: 3000; display: none; color: #333; overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        
        .theme-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 15px 0; }
        .theme-item { height: 40px; border-radius: 10px; border: 2px solid #eee; cursor: pointer; }

        textarea { 
            width: 100%; box-sizing: border-box; height: 250px; padding: 12px; 
            border-radius: 10px; border: 1px solid #ddd; font-family: inherit; 
            margin-top: 10px; line-height: 1.5; resize: vertical; display: block; font-size: 16px;
        }
        
        input[type="text"] {
            width: 100%; box-sizing: border-box; padding: 10px;
            border-radius: 8px; border: 1px solid #ddd; display: block; font-size: 16px;
        }

        .btn-action { width: 100%; padding: 15px; background: #3498db; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; box-sizing: border-box; }
        .btn-new { background: #2ecc71; margin-bottom: 0px; padding: 10px 15px; font-size: 13px; width: auto; }

        #temp-measurer {
            width: calc(var(--p-width) - 20vw); font-size: var(--font-size);
            line-height: 1.8; visibility: hidden; position: absolute; white-space: pre-wrap; word-break: break-all;
        }
        
        .list-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .list-main { cursor: pointer; flex-grow: 1; display: flex; flex-direction: column; gap: 4px; }
        .list-title { font-weight: bold; color: #2c3e50; }
        .delete-btn { color: #e74c3c; border: 1px solid #e74c3c; background: white; padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }

        .book-highlight { color: color-mix(in srgb, #3498db, var(--text-color) 30%); }
        .sup-highlight { font-size: 0.75em; vertical-align: super; line-height: 0; margin-left: 2px; }
        .book-bold { color: var(--text-color); font-weight: bold; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="book-viewport" id="swipe-area">
            <div class="book-info book-header">
                <span id="display-title">불러온 책 없음</span>
                <div class="font-controls">
                    <button class="font-btn" onclick="changeFontSize(-1)">-</button>
                    <span id="font-size-val">17</span>
                    <button class="font-btn" onclick="changeFontSize(1)">+</button>
                </div>
            </div>

            <div class="nav-area prev-area" onclick="movePage(-1)"></div>
            <div class="nav-area next-area" onclick="movePage(1)"></div>
            
            <div id="viewer-container" class="book-container"></div>
            
            <div class="book-info book-footer">
                <div class="page-nav-btns" onclick="goToPage(0)"><span>« 처음</span></div>
                <div id="page-indicator" onclick="promptPageJump()">1 / 1</div>
                <div class="page-nav-btns" onclick="goToPage(totalPages - 1)"><span>끝 »</span></div>
            </div>
        </div>

        <div class="bottom-menu">
            <button class="bottom-btn" onclick="openLibrary()">📚 내 서재</button>
            <button class="bottom-btn" onclick="openEditorModal()">🎨 테마/편집</button>
        </div>
    </div>

    <div id="setting-modal" class="modal">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 id="modal-mode-title" style="margin: 0;">🎨 도서 편집</h3>
            <button class="bottom-btn btn-new" onclick="prepareNewBook()">🆕 새 글 추가</button>
        </div>
        <div class="theme-grid">
            <div class="theme-item" style="background:#fcfaf5;" onclick="setTheme('#fcfaf5', '#2c3e50', '#1a1a1a')"></div>
            <div class="theme-item" style="background:#ffffff;" onclick="setTheme('#ffffff', '#111111', '#f0f0f0')"></div>
            <div class="theme-item" style="background:#f4ecd8;" onclick="setTheme('#f4ecd8', '#5b4636', '#2d241e')"></div>
            <div class="theme-item" style="background:#e8f4ea;" onclick="setTheme('#e8f4ea', '#1e3a24', '#0d1a11')"></div>
            <div class="theme-item" style="background:#2d3436;" onclick="setTheme('#2d3436', '#dfe6e9', '#000000')"></div>
        </div>
        <p style="font-size: 12px; color: #666; margin-bottom: 5px;">제목</p>
        <input type="text" id="book-title" placeholder="제목을 입력하세요">
        <p style="font-size: 12px; color: #666; margin-bottom: 5px; margin-top: 15px;">내용</p>
        <textarea id="editor" placeholder="내용을 입력하세요."></textarea>
        <button id="save-btn" class="btn-action" onclick="handleSave()">💾 저장하기</button>
        <button class="btn-action" style="background:#95a5a6;" onclick="closeModal('setting-modal')">닫기</button>
    </div>

    <div id="library-modal" class="modal">
        <h3>📚 내 서재</h3>
        <div id="book-list-container">로드 중...</div>
        <button class="btn-action" style="background:#95a5a6; margin-top:15px;" onclick="closeModal('library-modal')">닫기</button>
    </div>

    <div id="temp-measurer"></div>

    <script>
        const SUPABASE_URL = 'https://bmdlawnmwkotxvoieuce.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtZGxhd25td2tvdHh2b2lldWNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMzg3NjgsImV4cCI6MjA5MzYxNDc2OH0.P3H0Gob_HFjCtz12b_KGEyC-tCWHijEyH-9SHPKAVDM';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const viewerContainer = document.getElementById('viewer-container');
        const tempMeasurer = document.getElementById('temp-measurer');
        const editor = document.getElementById('editor');
        const titleInput = document.getElementById('book-title');
        const pageIndicator = document.getElementById('page-indicator');
        const fontSizeVal = document.getElementById('font-size-val');
        
        let currentIndex = 0;
        let totalPages = 1;
        let currentFontSize = 17;
        let currentBookId = null;

        // --- 1. 설정 저장 및 불러오기 ---
        function saveSettings() {
            const settings = {
                fontSize: currentFontSize,
                pageBg: getComputedStyle(document.documentElement).getPropertyValue('--page-bg'),
                textColor: getComputedStyle(document.documentElement).getPropertyValue('--text-color'),
                bgCanvas: getComputedStyle(document.documentElement).getPropertyValue('--bg-canvas')
            };
            localStorage.setItem('ebook_settings', JSON.stringify(settings));
        }

        function loadSettings() {
            const saved = localStorage.getItem('ebook_settings');
            if (saved) {
                const s = JSON.parse(saved);
                currentFontSize = s.fontSize || 17;
                document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
                fontSizeVal.innerText = currentFontSize;
                document.documentElement.style.setProperty('--page-bg', s.pageBg);
                document.documentElement.style.setProperty('--text-color', s.textColor);
                document.documentElement.style.setProperty('--bg-canvas', s.bgCanvas);
            }
        }

        function setTheme(pBg, text, outerBg) {
            document.documentElement.style.setProperty('--page-bg', pBg);
            document.documentElement.style.setProperty('--text-color', text);
            document.documentElement.style.setProperty('--bg-canvas', outerBg);
            saveSettings();
        }

        function changeFontSize(delta) {
            currentFontSize = Math.max(12, Math.min(40, currentFontSize + delta));
            document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
            fontSizeVal.innerText = currentFontSize;
            saveSettings();
            renderBook().then(() => updateSlider());
        }

        // --- 2. 페이지 이동 로직 ---
        function goToPage(index) {
            if (index >= 0 && index < totalPages) {
                currentIndex = index;
                updateSlider();
            }
        }

        function movePage(dir) { goToPage(currentIndex + dir); }

        function promptPageJump() {
            const target = prompt(`이동할 페이지 (1 ~ ${totalPages})`, currentIndex + 1);
            if (target) {
                const num = parseInt(target);
                if (!isNaN(num)) goToPage(num - 1);
            }
        }

        function updateSlider() {
            const w = document.querySelector('.book-viewport').offsetWidth;
            if (!w) return;
            viewerContainer.style.transform = `translateX(${-currentIndex * w}px)`;
            pageIndicator.innerText = `${currentIndex + 1} / ${totalPages}`;
            if (currentBookId) localStorage.setItem(`last_page_${currentBookId}`, currentIndex);
        }

        // --- 3. 핵심 렌더링 엔진 ---
        async function renderBook() {
            return new Promise((resolve) => {
                const rawContent = editor.value || "";
                const viewportH = document.querySelector('.book-viewport').offsetHeight;
                const maxH = viewportH * 0.82; 
                viewerContainer.innerHTML = "";
                tempMeasurer.innerHTML = "";
                
                const formattedContent = rawContent
                    .replace(/\[(.*?)\]/g, '<strong class="book-bold">$1</strong>')
                    .replace(/\((\d+)\)/g, '<span class="book-highlight sup-highlight">($1)</span>')
                    .replace(/\(([^0-9].*?)\)/g, '<span class="book-highlight">($1)</span>');

                const parts = formattedContent.split(/(<img[^>]*>)/g);
                let currentPageHTML = "";
                let pageNum = 1;

                for (let part of parts) {
                    if (part.startsWith('<img')) {
                        tempMeasurer.innerHTML = currentPageHTML + part;
                        if (tempMeasurer.offsetHeight > maxH && currentPageHTML !== "") {
                            addPageToViewer(currentPageHTML); pageNum++; currentPageHTML = part;
                        } else { currentPageHTML += part; }
                    } else {
                        const tokens = part.split(/(<[^>]*>|\s+)/);
                        for (let token of tokens) {
                            if (!token) continue;
                            const testContent = currentPageHTML + token;
                            tempMeasurer.innerHTML = testContent;
                            if (tempMeasurer.offsetHeight > maxH && currentPageHTML !== "") {
                                addPageToViewer(currentPageHTML); pageNum++; currentPageHTML = token; tempMeasurer.innerHTML = token;
                            } else { currentPageHTML = testContent; }
                        }
                    }
                }
                if (currentPageHTML.trim() !== "") addPageToViewer(currentPageHTML);
                totalPages = pageNum || 1;
                document.getElementById('display-title').innerText = titleInput.value || "불러온 책 없음";
                resolve();
            });
        }

        function addPageToViewer(content) {
            const div = document.createElement('div');
            div.className = 'page';
            div.innerHTML = `<div class="page-content">${content}</div>`;
            viewerContainer.appendChild(div);
        }

        // --- 4. 데이터 로드 및 저장 ---
        async function loadBook(id) {
            const { data } = await _supabase.from('ebooks').select('*').eq('id', id).single();
            if (data) {
                currentBookId = data.id;
                titleInput.value = data.title;
                editor.value = data.content;
                localStorage.setItem('last_read_book_id', id);
                await renderBook();
                const saved = localStorage.getItem(`last_page_${id}`);
                currentIndex = saved ? Math.min(parseInt(saved), totalPages - 1) : 0;
                updateSlider();
                closeModal('library-modal');
            }
        }

        async function handleSave() {
            const title = titleInput.value.trim() || "제목 없음";
            const content = editor.value;
            if (currentBookId) {
                await _supabase.from('ebooks').update({ title, content }).eq('id', currentBookId);
                alert('저장되었습니다.');
            } else {
                const { data } = await _supabase.from('ebooks').insert([{ title, content }]).select();
                currentBookId = data[0].id;
                alert('서재에 추가되었습니다.');
            }
            renderBook().then(() => updateSlider());
            closeModal('setting-modal');
        }

        // --- 5. 이벤트 리스너 (Resize & Swipe) ---

        // 리사이즈 시 현재 페이지 유지 완성 코드
        window.addEventListener('resize', async () => { 
            if(editor.value) {
                const preIdx = currentIndex; 
                await renderBook(); 
                currentIndex = Math.min(preIdx, totalPages - 1);
                updateSlider();
            } 
        });

        // 스와이프 기능
        let touchStartX = 0;
        let touchEndX = 0;
        const swipeArea = document.getElementById('swipe-area');

        swipeArea.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        swipeArea.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            const deltaX = touchEndX - touchStartX;
            if (Math.abs(deltaX) > 60) { // 60px 이상 움직여야 작동
                if (deltaX > 0) movePage(-1); // 오른쪽으로 밀기
                else movePage(1); // 왼쪽으로 밀기
            }
        }, { passive: true });

        // --- 초기화 ---
        window.addEventListener('DOMContentLoaded', async () => {
            loadSettings();
            const lastId = localStorage.getItem('last_read_book_id');
            if (lastId) await loadBook(lastId); else await renderBook();
        });

        // 기타 모달 및 유틸리티
        function openLibrary() {
            openModal('library-modal');
            const container = document.getElementById('book-list-container');
            container.innerHTML = '로드 중...';
            _supabase.from('ebooks').select('id, title').order('created_at', { ascending: false }).then(({data}) => {
                if (!data || data.length === 0) { container.innerHTML = '비어있습니다.'; return; }
                container.innerHTML = data.map(b => `
                    <div class="list-item">
                        <div class="list-main" onclick="loadBook('${b.id}')"><span class="list-title">📘 ${b.title}</span></div>
                        <button class="delete-btn" onclick="deleteBook('${b.id}', event)">삭제</button>
                    </div>
                `).join('');
            });
        }
        async function deleteBook(id, e) {
            e.stopPropagation();
            if (confirm('삭제하시겠습니까?')) {
                await _supabase.from('ebooks').delete().eq('id', id);
                localStorage.removeItem(`last_page_${id}`);
                if (currentBookId === id) location.reload(); else openLibrary();
            }
        }
        function openEditorModal() {
            document.getElementById('modal-mode-title').innerText = currentBookId ? "📝 도서 수정" : "🆕 새 도서 작성";
            openModal('setting-modal');
        }
        function prepareNewBook() {
            if (confirm('새 글을 작성할까요?')) {
                currentBookId = null; titleInput.value = ""; editor.value = "";
                renderBook().then(() => updateSlider()); closeModal('setting-modal');
            }
        }
        function openModal(id) { document.getElementById(id).style.display = 'block'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
