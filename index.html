<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>풀스크린 와이드 이북</title>
    <style>
        :root {
            /* 너비를 화면의 95%로 확장 */
            --p-width: 95vw; 
            --p-height: 85vh;
            --bg-canvas: #1a1a1a;
            --page-bg: #fcfaf5;
            --text-color: #2c3e50;
            --font-size: 18px; /* 넓은 화면에 맞춰 기본 폰트 크기 상향 */
            --accent: #3498db;
        }

        body { 
            background: var(--bg-canvas); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; font-family: 'Pretendard', sans-serif;
            overflow: hidden; transition: background 0.3s;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        /* 뷰어: 좌우를 꽉 채우는 스타일 */
        .book-viewport {
            width: var(--p-width); height: var(--p-height);
            position: relative; overflow: hidden; border-radius: 10px; 
            box-shadow: 0 40px 100px rgba(0,0,0,0.6); 
            background: var(--page-bg); transition: 0.3s;
        }

        .book-container { display: flex; height: 100%; transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        
        .page { 
            min-width: var(--p-width); 
            height: 100%; 
            /* 화면이 넓으므로 좌우 여백을 15%로 늘려 가독성 확보 */
            padding: 5% 5%; 
            box-sizing: border-box; 
            position: relative; 
            color: var(--text-color); 
        }

        .page-content { 
            font-size: var(--font-size); 
            line-height: 1.9; 
            text-align: justify; 
            word-break: break-all;
        }

        /* 하단 메뉴 */
        .bottom-menu { display: flex; gap: 15px; justify-content: center; width: 100%; }
        .bottom-btn { 
            padding: 12px 24px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.1); color: white; backdrop-filter: blur(8px);
            cursor: pointer; font-weight: bold; font-size: 14px; transition: all 0.2s;
        }
        .bottom-btn:hover { background: rgba(255,255,255,0.2); }

        /* 네비게이션 영역 */
        .nav-area { position: absolute; top: 0; height: 100%; width: 15%; z-index: 1000; cursor: pointer; }
        .prev-area { left: 0; } .next-area { right: 0; }

        .page-header { position: absolute; top: 3%; left: 0; width: 100%; text-align: center; font-size: 12px; opacity: 0.5; }
        .page-footer { position: absolute; bottom: 3%; left: 0; width: 100%; text-align: center; font-size: 13px; opacity: 0.5; }

        /* 모달 스타일 */
        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: min(600px, 90%); max-height: 80vh; background: white;
            padding: 30px; border-radius: 25px; box-shadow: 0 30px 60px rgba(0,0,0,0.5);
            z-index: 3000; overflow-y: auto; color: #333; display: none;
        }
        .modal.active { display: block; }
        .setting-group { background: #f8f9fa; padding: 15px; border-radius: 15px; margin-bottom: 15px; }
        input[type="text"], textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; }
        textarea { height: 150px; margin-top: 5px; }
        .flex-row { display: flex; gap: 10px; margin-top: 5px; }
        .flex-row button { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: white; cursor: pointer; }
        .btn-action { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 5px; color: white; }

        /* 측정용 렌더러 (패킹 30% 제외) */
        #temp-renderer { width: calc(var(--p-width) - 30%); visibility: hidden; position: absolute; font-size: var(--font-size); line-height: 1.9; }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="book-viewport">
            <div class="nav-area prev-area" onclick="movePage(-1)"></div>
            <div class="nav-area next-area" onclick="movePage(1)"></div>
            <div class="book-container" id="viewer"></div>
        </div>

        <div class="bottom-menu">
            <button class="bottom-btn" onclick="openModal('library-modal')">📚 내 서재</button>
            <button class="bottom-btn" onclick="openModal('setting-modal')">⚙️ 편집/설정</button>
        </div>
    </div>

    <!-- 서재 모달 -->
    <div id="library-modal" class="modal">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <span style="font-size:20px; font-weight:bold;">나의 서재</span>
            <span style="cursor:pointer; font-size:24px; color:#999;" onclick="closeModal('library-modal')">&times;</span>
        </div>
        <div id="book-list-container"></div>
    </div>

    <!-- 설정 모달 -->
    <div id="setting-modal" class="modal">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <span style="font-size:20px; font-weight:bold;">편집 및 설정</span>
            <span style="cursor:pointer; font-size:24px; color:#999;" onclick="closeModal('setting-modal')">&times;</span>
        </div>
        <div class="setting-group">
            <input type="text" id="book-title" value="와이드 스크린 북">
            <textarea id="editor">화면 너비를 95%로 확장했습니다. 넓은 화면에서는 글줄이 너무 길면 읽기 힘들기 때문에 좌우 여백(Padding)을 15%로 설정하여 가독성을 높였습니다. 기기를 가로로 눕히거나 창 크기를 조절하면 실시간으로 페이지가 재계산됩니다.</textarea>
        </div>
        <div class="setting-group">
            <span style="font-size:13px; color:#666;">글자 크기</span>
            <div class="flex-row"><button onclick="changeFontSize(-2)">가-</button><button onclick="changeFontSize(2)">가+</button></div>
        </div>
        <button class="btn-action" style="background:#2ecc71;" onclick="saveToLibrary()">✨ 서재에 저장</button>
        <button class="btn-action" style="background:#3498db;" onclick="applyAndClose()">📖 적용하기</button>
    </div>

    <div id="temp-renderer"></div>

    <script>
        const viewer = document.getElementById('viewer');
        const tempRenderer = document.getElementById('temp-renderer');
        const editor = document.getElementById('editor');
        const titleInput = document.getElementById('book-title');
        
        let currentIndex = 0, totalPages = 0, currentFontSize = 18;

        function openModal(id) {
            document.getElementById(id).style.display = 'block';
            if(id === 'library-modal') renderLibrary();
        }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function saveToLibrary() {
            const books = JSON.parse(localStorage.getItem('fullWidthLibrary') || '[]');
            books.unshift({ id: Date.now(), title: titleInput.value, content: editor.value });
            localStorage.setItem('fullWidthLibrary', JSON.stringify(books));
            alert('저장되었습니다.');
        }

        function renderLibrary() {
            const container = document.getElementById('book-list-container');
            const books = JSON.parse(localStorage.getItem('fullWidthLibrary') || '[]');
            container.innerHTML = books.length ? "" : "<p style='text-align:center; color:#999;'>서재가 비어있습니다.</p>";
            books.forEach(book => {
                const div = document.createElement('div');
                div.style.padding = '15px'; div.style.background = '#f8f9fa'; div.style.marginBottom = '10px'; div.style.borderRadius = '10px'; div.style.cursor = 'pointer';
                div.innerHTML = `📘 ${book.title}`;
                div.onclick = () => { titleInput.value = book.title; editor.value = book.content; applyAndClose(); closeModal('library-modal'); };
                container.appendChild(div);
            });
        }

        function changeFontSize(delta) {
            currentFontSize = Math.max(12, Math.min(40, currentFontSize + delta));
            document.documentElement.style.setProperty('--font-size', currentFontSize + 'px');
            paginate();
        }

        function applyAndClose() { paginate(); closeModal('setting-modal'); }

        function paginate() {
            const viewport = document.querySelector('.book-viewport');
            const maxH = viewport.offsetHeight * 0.8;
            const text = editor.value || " ";
            const title = titleInput.value;
            
            // 렌더러 너비 동기화
            tempRenderer.style.width = `calc(var(--p-width) - 30%)`;
            
            viewer.innerHTML = ""; tempRenderer.innerHTML = "";
            let currentPContent = "", pageCount = 1;
            
            text.split('\n').forEach((pText) => {
                const p = document.createElement('p'); p.style.marginBottom = "1.5em";
                p.innerText = pText.trim() === "" ? "\u00A0" : pText;
                tempRenderer.appendChild(p);
                
                if (tempRenderer.offsetHeight > maxH) {
                    addPage(currentPContent, pageCount++, title);
                    tempRenderer.innerHTML = ""; tempRenderer.appendChild(p);
                    currentPContent = p.outerHTML;
                } else { currentPContent += p.outerHTML; }
            });
            
            if (currentPContent) addPage(currentPContent, pageCount, title);
            totalPages = pageCount; currentIndex = 0; updateSlider();
        }

        function addPage(content, num, title) {
            const pageDiv = document.createElement('div');
            pageDiv.className = 'page';
            pageDiv.innerHTML = `<div class="page-header">${title}</div><div class="page-content">${content}</div><div class="page-footer">${num}</div>`;
            viewer.appendChild(pageDiv);
        }

        function movePage(dir) {
            const newIdx = currentIndex + dir;
            if (newIdx >= 0 && newIdx < totalPages) { currentIndex = newIdx; updateSlider(); }
        }

        function updateSlider() {
            const w = document.querySelector('.book-viewport').offsetWidth;
            viewer.style.transform = `translateX(${-currentIndex * w}px)`;
        }

        window.addEventListener('resize', paginate);
        paginate();
    </script>
</body>
</html>
